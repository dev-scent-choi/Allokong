<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1"><title>꼬물꼬물</title>
<style>
:root{--ink:#202923;--muted:#66736b;--paper:#fcfcf8;--surface:#fff;--line:#d9e1d9;--green:#246b4b;--pale:#edf4ee;--active:#ef7586}*{box-sizing:border-box}body{margin:0;background:#e9efe9;color:var(--ink);font:15px/1.4 "Segoe UI","Malgun Gothic",sans-serif}.app{max-width:448px;min-height:100vh;margin:auto;background:var(--paper);padding-bottom:84px}.screen{display:none}.screen.active{display:block}.top{height:64px;padding:0 16px;display:grid;grid-template-columns:76px 1fr 76px;align-items:center;border-bottom:1px solid var(--line);background:var(--paper)}.back,.plain{border:0;background:none;color:var(--muted);font-size:13px;text-align:left}.heading{text-align:center;font-size:16px;font-weight:700}.done{border:0;background:var(--green);color:#fff;border-radius:10px;padding:9px 11px;font-size:13px;font-weight:700}.content{padding:16px}.hero{background:var(--pale);border-radius:18px;padding:18px;min-height:132px}.hero h1{font-size:21px;line-height:1.25;margin:0 0 7px}.hero p{margin:0;color:var(--muted);font-size:13px}.hero-art{margin-top:15px;height:42px;display:flex;gap:7px;align-items:end}.hero-art span{display:block;border-radius:8px;background:#81b89a}.hero-art span:nth-child(1){width:55px;height:25px}.hero-art span:nth-child(2){width:42px;height:42px;background:#f2b56d}.hero-art span:nth-child(3){width:74px;height:32px;background:#9bbfdd}.section-row{display:flex;justify-content:space-between;align-items:center;margin:20px 0 9px}.section-row b{font-size:15px}.section-row button{border:0;background:none;color:var(--green);font-size:13px}.cards{display:grid;grid-template-columns:repeat(3,1fr);gap:9px}.card{border:1px solid var(--line);background:var(--surface);border-radius:14px;padding:10px 7px;text-align:left}.card-art{height:62px;border-radius:10px;background:linear-gradient(135deg,#fbdb8b,#f6a3ab);margin-bottom:8px}.card:nth-child(2) .card-art{background:linear-gradient(135deg,#99d5c3,#77b4d5)}.card:nth-child(3) .card-art{background:linear-gradient(135deg,#c4a8da,#f4d36f)}.card b{display:block;font-size:12px}.card small{color:var(--muted);font-size:11px}.mission{margin-top:10px;padding:11px 12px;background:#fff4d0;border-radius:12px;font-size:13px}.toolbox{margin:12px 14px 0;border:1px solid var(--line);border-radius:14px;background:var(--surface);overflow:hidden}.tools-title{width:100%;padding:11px 12px;border:0;background:none;display:flex;justify-content:space-between;align-items:center;color:var(--ink);font-size:13px;font-weight:700}.tools-title span{color:var(--muted);font-size:12px;font-weight:400}.tools-body{display:none;padding:11px 12px 13px;border-top:1px solid var(--line)}.toolbox.open .tools-body{display:block}.tool-row{display:flex;gap:7px;overflow:auto}.tool{min-width:62px;padding:7px 7px;border:1px solid var(--line);border-radius:10px;background:#fff;color:var(--muted);display:flex;flex-direction:column;align-items:center;gap:3px;font-size:11px}.tool svg{width:20px;height:20px;stroke:currentColor;fill:none;stroke-width:1.8}.tool.active{color:var(--green);border-color:var(--green);background:var(--pale);font-weight:700}.tool-label{color:var(--muted);font-size:11px;margin:13px 0 6px}.colors{display:flex;gap:9px;overflow:auto}.color{flex:0 0 29px;height:29px;border:2px solid transparent;border-radius:50%;background:var(--c)}.color.active{border-color:var(--ink);box-shadow:0 0 0 2px #fff}.canvas-wrap{padding:12px 14px 0}.meta{display:flex;justify-content:space-between;margin:0 1px 9px;color:var(--muted);font-size:12px}.meta b{color:var(--ink)}.coloring-canvas{height:calc(100vh - 263px);min-height:370px;max-height:590px;display:grid;place-items:center;border:1px solid var(--line);border-radius:18px;background:#fff;overflow:hidden}.art{width:min(81%,335px)}.fillable{fill:transparent;stroke:#263029;stroke-width:5;stroke-linejoin:round;transition:fill .15s}.outline{fill:none;stroke:#263029;stroke-width:5;stroke-linecap:round;stroke-linejoin:round}.tip{font-size:11px;color:var(--muted);margin-top:9px;text-align:center}.drawpad{display:block;width:100%;height:390px;border:1px solid var(--line);border-radius:16px;background:#fff;touch-action:none}.draw-controls{display:flex;gap:9px;align-items:center;margin-top:12px}.draw-controls .color{width:28px;flex-basis:28px}.clear{margin-left:auto;border:1px solid var(--line);background:#fff;border-radius:9px;padding:8px 10px;color:var(--muted);font-size:12px}.nav{position:fixed;z-index:5;bottom:0;left:50%;transform:translateX(-50%);width:min(448px,100%);height:84px;display:grid;grid-template-columns:repeat(5,1fr);align-items:center;padding:8px 8px 10px;background:#fff;border-top:1px solid var(--line)}.nav button{height:60px;border:0;background:none;color:var(--muted);display:flex;flex-direction:column;align-items:center;justify-content:center;gap:3px;font-size:11px}.nav svg{width:21px;height:21px;stroke:currentColor;fill:none;stroke-width:1.8}.nav button.active{color:var(--green);font-weight:700}.nav .create{width:54px;height:54px;justify-self:center;margin-top:-28px;border:4px solid #fff;border-radius:50%;background:var(--green);color:#fff;box-shadow:0 4px 12px #173d2a33}.nav .create svg{width:24px;height:24px}.nav .create span{display:none}.empty{padding:42px 12px;text-align:center;color:var(--muted)}.empty b{color:var(--ink);display:block;font-size:16px;margin-bottom:5px}.record{padding:16px;border-radius:15px;background:var(--pale)}.record h2{font-size:16px;margin:0}.record-grid{display:flex;justify-content:space-between;margin-top:14px;text-align:center;font-size:26px}.record-grid small{display:block;font-size:11px;color:var(--muted)}.toast{display:none;position:fixed;z-index:9;bottom:98px;left:50%;transform:translateX(-50%);padding:10px 13px;border-radius:10px;background:#202923;color:#fff;font-size:12px}.toast.show{display:block}@media (orientation:landscape) and (max-height:680px){.app{max-width:none;padding-right:84px;padding-bottom:0}.nav{left:auto;right:0;transform:none;width:84px;height:100vh;grid-template-columns:1fr;grid-template-rows:repeat(5,1fr);border-left:1px solid var(--line);border-top:0}.nav .create{margin-top:0}.coloring-canvas{height:calc(100vh - 212px);max-height:none}.drawpad{height:calc(100vh - 180px)}}
</style>
</head>
<body>
<main class="app">
 <section id="home" class="screen active"><header class="top"><span></span><div class="heading">꼬물꼬물</div><button class="plain" type="button">내 정보</button></header><div class="content"><div class="hero"><h1>오늘은 무엇을<br>색칠해 볼까?</h1><p>마음에 드는 도안을 골라 바로 시작해요.</p><div class="hero-art"><span></span><span></span><span></span></div></div><div class="section-row"><b>이어 그리기</b><button type="button">모두 보기</button></div><div class="cards"><button class="card drawing-card" data-title="바다 친구"><span class="card-art"></span><b>바다 친구</b><small>색칠하기</small></button><button class="card drawing-card" data-title="봄 정원"><span class="card-art"></span><b>봄 정원</b><small>색칠하기</small></button><button class="card drawing-card" data-title="우주 여행"><span class="card-art"></span><b>우주 여행</b><small>색칠하기</small></button></div><div class="section-row"><b>오늘의 미션</b></div><div class="mission">색 3가지로 도안을 완성하면 별을 받아요.</div></div></section>
 <section id="coloring" class="screen"><header class="top"><button class="back" data-back="home" type="button">← 이전</button><div id="color-title" class="heading">나의 고양이 도안</div><button id="done" class="done" type="button">완성</button></header><section id="toolbox" class="toolbox open"><button id="toggle-tools" class="tools-title" type="button" aria-expanded="true">도구 <span id="tool-status">채우기 · 분홍</span><span id="chevron">⌃</span></button><div class="tools-body"><div class="tool-row"><button class="tool active" data-tool="채우기" type="button"><svg viewBox="0 0 24 24"><path d="m7 4 9 9-7 7-9-9zM15 13l3 3M18 19h.01"/></svg>채우기</button><button class="tool" data-tool="크레용" type="button"><svg viewBox="0 0 24 24"><path d="m5 19 10-10 4 4L9 23H5zM14 6l2-2 4 4-2 2"/></svg>크레용</button><button class="tool" data-tool="붓" type="button"><svg viewBox="0 0 24 24"><path d="m14 4 6 6M4 20c2 0 3-1 3-3s1-3 3-3l8-8 3 3-8 8c0 2-1 3-3 3z"/></svg>붓</button><button class="tool" data-tool="스티커" type="button"><svg viewBox="0 0 24 24"><path d="m12 3 2.3 5 5.4.6-4 3.7 1.1 5.4-4.8-2.7-4.8 2.7 1.1-5.4-4-3.7L9.7 8z"/></svg>스티커</button><button class="tool" data-tool="지우개" type="button"><svg viewBox="0 0 24 24"><path d="m7 19-3-3 9-9 5 5-7 7zM14 19h6"/></svg>지우개</button></div><div class="tool-label">색상</div><div class="colors"><button class="color active" style="--c:#ef7586" data-name="분홍" type="button"></button><button class="color" style="--c:#f1bd45" data-name="노랑" type="button"></button><button class="color" style="--c:#ef8a45" data-name="주황" type="button"></button><button class="color" style="--c:#6caee0" data-name="파랑" type="button"></button><button class="color" style="--c:#63b98b" data-name="초록" type="button"></button><button class="color" style="--c:#9e82cf" data-name="보라" type="button"></button><button class="color" style="--c:#795548" data-name="갈색" type="button"></button><button class="color" style="--c:#f5f5f5" data-name="흰색" type="button"></button></div></div></section><div class="canvas-wrap"><div class="meta"><span><b>꽃밭의 고양이</b> · 3/3</span><span>자동 저장됨</span></div><div class="coloring-canvas"><svg class="art" viewBox="0 0 300 370" role="img" aria-label="색칠할 고양이 도안"><path class="fillable" d="M72 136 54 48l66 43M228 136l18-88-66 43"/><path class="fillable" d="M74 138C78 92 222 92 226 138v78c0 59-37 92-76 92s-76-33-76-92z"/><ellipse class="fillable" cx="150" cy="306" rx="72" ry="38"/><path class="outline" d="M85 290c-39 3-48 48-10 55 20 4 35-6 37-21M215 290c39 3 48 48 10 55-20 4-35-6-37-21"/><path class="outline" d="M118 173h1M182 173h1M150 191l-7 8 7 5 7-5zM150 209c-10 13-24 11-29 7M150 209c10 13 24 11 29 7M103 202l-36-7M103 218l-36 8M197 202l36-7M197 218l36 8M119 271c16 10 46 10 62 0"/></svg></div><div class="tip">색을 고르고 각 영역을 눌러 색칠하세요.</div></div></section>
 <section id="draw" class="screen"><header class="top"><button class="back" data-back="home" type="button">← 이전</button><div class="heading">새 스케치</div><button id="save-sketch" class="done" type="button">저장</button></header><div class="content"><p style="margin:0;color:var(--muted);font-size:13px">직접 그린 뒤 나만의 도안으로 저장할 수 있어요.</p><canvas id="drawpad" class="drawpad" width="800" height="900" aria-label="스케치 캔버스"></canvas><div class="draw-controls"><button class="color active" style="--c:#202923" data-draw="#202923" type="button"></button><button class="color" style="--c:#ef7586" data-draw="#ef7586" type="button"></button><button class="color" style="--c:#6caee0" data-draw="#6caee0" type="button"></button><button class="color" style="--c:#63b98b" data-draw="#63b98b" type="button"></button><button id="clear-pad" class="clear" type="button">모두 지우기</button></div></div></section>
 <section id="gallery" class="screen"><header class="top"><span></span><div class="heading">모아보기</div><span></span></header><div class="content"><div class="empty"><b>아직 모은 작품이 없어요</b>첫 작품을 완성하면 여기에 저장됩니다.</div></div></section>
 <section id="rank" class="screen"><header class="top"><span></span><div class="heading">이번 주 기록</div><span></span></header><div class="content"><div class="record"><h2>나의 즐거움 기록</h2><div class="record-grid"><div>12<small>색칠</small></div><div>3<small>도안</small></div><div>18<small>칭찬</small></div></div></div></div></section>
 <section id="profile" class="screen"><header class="top"><span></span><div class="heading">내 정보</div><span></span></header><div class="content"><div class="record"><h2>보호자 안전 설정</h2><p style="color:var(--muted);font-size:13px">작품 공개 범위와 댓글을 보호자가 관리합니다.</p></div></div></section>
 <nav class="nav" aria-label="하단 메뉴"><button class="active" data-screen="home" type="button"><svg viewBox="0 0 24 24"><path d="m3 10 9-7 9 7v10H3zM9 21v-6h6v6"/></svg><span>놀기</span></button><button data-screen="gallery" type="button"><svg viewBox="0 0 24 24"><path d="M4 5h16v15H4zM7 16l3-4 3 3 2-2 3 3"/></svg><span>모아보기</span></button><button class="create" data-screen="draw" type="button" aria-label="스케치 만들기"><svg viewBox="0 0 24 24"><path d="M12 5v14M5 12h14"/></svg><span>만들기</span></button><button data-screen="rank" type="button"><svg viewBox="0 0 24 24"><path d="M8 21h8M12 17v4M7 3h10l-1 8a4 4 0 0 1-8 0zM7 6H4l1 4a3 3 0 0 0 2 2M17 6h3l-1 4a3 3 0 0 1-2 2"/></svg><span>랭크</span></button><button data-screen="profile" type="button"><svg viewBox="0 0 24 24"><circle cx="12" cy="8" r="4"/><path d="M4 21c1-4 4-6 8-6s7 2 8 6"/></svg><span>내 정보</span></button></nav>
</main><div id="toast" class="toast" aria-live="polite"></div>
<script>
const $=s=>document.querySelector(s),$$=s=>document.querySelectorAll(s);let activeColor='#ef7586',drawColor='#202923';function show(id){$$('.screen').forEach(s=>s.classList.toggle('active',s.id===id));$$('.nav button').forEach(b=>b.classList.toggle('active',b.dataset.screen===id));window.scrollTo(0,0)}function toast(t){$('#toast').textContent=t;$('#toast').classList.add('show');setTimeout(()=>$('#toast').classList.remove('show'),1500)}$$('[data-screen]').forEach(b=>b.onclick=()=>show(b.dataset.screen));$$('[data-back]').forEach(b=>b.onclick=()=>show(b.dataset.back));$$('.drawing-card').forEach(b=>b.onclick=()=>{$('#color-title').textContent=b.dataset.title+' 색칠하기';show('coloring')});$('#toggle-tools').onclick=()=>{const x=$('#toolbox');x.classList.toggle('open');const open=x.classList.contains('open');$('#toggle-tools').setAttribute('aria-expanded',open);$('#chevron').textContent=open?'⌃':'⌄'};$$('.tool').forEach(b=>b.onclick=()=>{$$('.tool').forEach(x=>x.classList.remove('active'));b.classList.add('active');$('#tool-status').textContent=b.dataset.tool+' · '+document.querySelector('.colors .color.active').dataset.name});$$('.colors .color').forEach(b=>b.onclick=()=>{$$('.colors .color').forEach(x=>x.classList.remove('active'));b.classList.add('active');activeColor=b.style.getPropertyValue('--c');$('#tool-status').textContent=document.querySelector('.tool.active').dataset.tool+' · '+b.dataset.name});$$('.fillable').forEach(shape=>shape.onclick=e=>{e.stopPropagation();shape.style.fill=activeColor;toast('색칠했어요')});$('#done').onclick=()=>toast('작품을 저장했어요');const pad=$('#drawpad'),ctx=pad.getContext('2d');ctx.lineCap='round';ctx.lineJoin='round';ctx.lineWidth=10;let drawing=false,last;function point(e){const r=pad.getBoundingClientRect(),p=e.touches?e.touches[0]:e;return{x:(p.clientX-r.left)*pad.width/r.width,y:(p.clientY-r.top)*pad.height/r.height}}function start(e){drawing=true;last=point(e)}function move(e){if(!drawing)return;e.preventDefault();const p=point(e);ctx.strokeStyle=drawColor;ctx.beginPath();ctx.moveTo(last.x,last.y);ctx.lineTo(p.x,p.y);ctx.stroke();last=p}function end(){drawing=false}pad.addEventListener('pointerdown',start);pad.addEventListener('pointermove',move);pad.addEventListener('pointerup',end);pad.addEventListener('pointerleave',end);$$('[data-draw]').forEach(b=>b.onclick=()=>{drawColor=b.dataset.draw;$$('[data-draw]').forEach(x=>x.classList.remove('active'));b.classList.add('active')});$('#clear-pad').onclick=()=>ctx.clearRect(0,0,pad.width,pad.height);$('#save-sketch').onclick=()=>toast('스케치를 나만의 도안으로 저장했어요');
</script></body></html>
